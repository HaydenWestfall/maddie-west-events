name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the committed .env.production (VITE_* values are public and baked into the bundle).
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true # keep dist/.htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maddiewestevents.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Tracks what it uploaded in .ftp-deploy-sync-state.json on the server, so
      # later runs only send changed files and only remove files it put there.
      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps # switch to "ftp" if the TLS handshake fails
          local-dir: ./dist/
          server-dir: ./ # relative to the FTP account's root directory (public_html)
